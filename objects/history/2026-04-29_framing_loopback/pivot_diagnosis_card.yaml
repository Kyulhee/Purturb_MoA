    - cause: "RQ3 순환 평가는 프레이밍 수준 문제 — '잔차에서 에피스태시스를 탐지'와 '에피스태시스=잔차'가 동일. 분해가 성공하면 AUROC=1.0(순환), 실패하면 AUROC<0.75(실패)인 구조"
      evidence: ["run_09: AUROC=1.0 (additive formula)은 residual_mag와 ground-truth가 동일 계산", "run_09: product-GT rho=0.62로 다른 공식에서는 62%만 복구 — 공식 선택이 결과를 결정"]
    - cause: "소거실험 없이 Full model만 평가 → ICM/MC Dropout/3-공식 등 각 구성요소의 독립 기여를 입증 불가"
      evidence: ["Planning 8구성(A1-B2) 중 A1만 수행", "result_card baseline_comparison.delta=null"]
    - cause: "Precision 미측정으로 trivial baseline(Precision~0.3) 대비 개선 여부를 입증 불가 — novelty_ledger의 핵심 기여 'Precision 0.3→0.6'이 미검증"
      evidence: ["result_card: trivial_baseline_delta.meaningful=null", "novelty_ledger: target_delta_required='Precision 0.3→0.6 이상'"]
  unlikely_root_causes:
    - cause: "구현 버그로 인한 순환"
      evidence: ["run_09 v1→v3 반복 개선에서 순환 문제가 공식적으로 인지됨. 버그가 아닌 구조적 문제"]
    - cause: "데이터셋이 너무 작아서"
      evidence: ["Replogle 843 섭동에서도 동일한 구조적 순환. 규모가 아니라 평가 설계의 문제"]

pivot_options:
