    pros: ["workshop paper는 가능"]
    cons: ["trivial baseline 대비 개선 미입증 상태에서 weaker claim도 위태로움"]
    required_condition: "Precision 측정으로 최소 0.3→0.4+ 확인"
  - option: "additional_validation"
    pros: ["기존 프레이밍 유지"]
    cons: ["순환은 실험 추가로 해소되는 문제가 아님 — 구조적 한계"]
    required_condition: "순환을 피하는 독립 ground-truth 발견"
  - option: "loopback_to_planning"
    pros: ["소거실험 설계 보완 가능"]
    cons: ["RQ3 순환은 설계 문제가 아니라 프레이밍 문제. Planning 루프백만으로는 근본 해결 안 됨"]
    required_condition: "프레이밍이 그대로 유효하다는 전제"
  - option: "loopback_to_framing"
    pros: ["RQ3 순환의 근본 원인(잔차=에피스태시스의 동어반복)을 프레이밍 수준에서 재검토 가능", "새로운 RQ3 정의로 순환을 구조적으로 회피 가능", "기존 RQ1/RQ2/RQ4 성과는 유지하면서 RQ3만 재설계 가능"]
    cons: ["프레이밍 재작업 필요", "기존 run_09/10 결과의 RQ3 부분은 무효화"]
    required_condition: "RQ3이 근본적으로 재정의되어야 한다는 합의"
  - option: "loopback_to_literature_review"
    pros: ["에피스태시스 탐지의 독립적 검증 방법을 문헌에서 탐색 가능"]
    cons: ["시간 소모. 기존 문헌 리뷰에서 이미 '직접 경쟁자 0개' 확인"]
    required_condition: "문헌에 순환 없는 평가 패러다임이 존재할 가능성"
  - option: "stop_or_merge"
    pros: ["RQ2/RQ4 결과로 workshop paper 가능"]
    cons: ["RQ3 핵심 기여가 무효. '잔차→에피스태시스' 신규성이 입증 안 됨"]
    required_condition: "RQ3를 포기할 의사"

