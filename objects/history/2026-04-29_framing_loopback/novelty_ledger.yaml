    interpretation: "원리 자체는 통계적 잔차 분석과 유사하나, perturb-seq 도메인에 적용은 신규"

  domain_application:
    claim: "Perturb-seq 조합 섭동 잔차에서 에피스타시스 탐지"
    novelty_level: "strong"
    prior_art: []
