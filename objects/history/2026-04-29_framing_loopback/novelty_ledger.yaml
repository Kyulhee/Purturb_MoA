    novelty_level: "strong"
    prior_art:
      - "CIPHER: 단일 신호원 불확실성"
    interpretation: "다중 신호원 결합과 3-공식 민감도는 구체적 기여"

  integration_synergy:
    claim: "불확실성 높은 곳 = 에피스태시스 가능성 높은 곳의 자연스러운 연결"
    novelty_level: "moderate"
    prior_art: []
    required_evidence_for_synergy:
      - "UQ-에피스태시스 상관관계 실증"
      - "AL 획득 함수에서 에피스태시스 우선 탐지 확인"
    interpretation: "개념적 연결은 직관적이나 실증적 검증 필요 — run_09/10에서 부분 확인"

