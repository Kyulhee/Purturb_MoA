    result: "ICM 정규화가 에피스태시스 전이를 개선하지 못함 (0.966×)"
    implication: "주 가설 기각. ICM MMD 정규화는 z_tx 분포 정렬에는 유효하나 에피스태시스 전이에는 무효"
