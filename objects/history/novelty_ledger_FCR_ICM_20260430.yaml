    - "C3TL (교세포 일반 전이, 에피스태시스 특화 아님)"
    - "CFM-GP (교세포 flow, 인과 분해 없음)"
    - "Pacalin (가법 합 잔차→GI 분류, 교세포 전이 없음)"
  abstract_principle_prior_art:
    - "Tan 2018 (가법 근사 잔차=비가법 구조)"
    - "Diamond 2024 (ML feature interaction + FDR)"
