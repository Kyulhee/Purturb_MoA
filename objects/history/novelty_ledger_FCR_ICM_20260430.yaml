object_type: NoveltyLedger
status: active
last_updated: "2026-04-30"
linked_stage: framing
linked_run: run_05

target_contribution: "에피스태시스 교세포 보존 정량화 + 잔차 순위 전이 예측 + MC Dropout UQ + 능동학습"

novelty_layers:
  abstract_principle:
    claim: "에피스태시스가 세포유형 간에 부분 보존되며, 잔차 순위 전이로 새 세포유형의 에피스태시스를 zero-shot 예측 가능"
    novelty_level: "strong"
    prior_art:
      - "C3TL: 교세포 일반 섭동 전이 (에피스태시스 특화 아님)"
      - "CFM-GP: 교세포 flow matching (에피스태시스 전이 없음)"
    interpretation: "에피스태시스의 교세포 보존은 ICM과 무관한 생물학적 사실. 이를 예측에 활용하는 것은 새로운 원리. 단 ICM이 이 전이를 개선한다는 주장은 run_11에서 기각"
  domain_application:
    claim: "Perturb-seq 조합 섭동 잔차에서 에피스태시스 교세포 보존 정량화 및 잔차 순위 전이 예측"
    novelty_level: "strong"
    prior_art: []
    interpretation: "직접 경쟁자 0개 (PubMed 0건, arXiv 0건). 누구도 에피스태시스 교세포 보존을 정량화하거나 전이에 활용하지 않음"
  method_specificity:
    claim: "잔차 순위 전이(A7) + MC Dropout UQ + 교세포 AL + 3-공식 민감도"
    novelty_level: "moderate"
    prior_art:
      - "CIPHER: 단일 신호원 불확실성 (교세포 전이 없음)"
      - "NAIAD: 적응적 임베딩 + AL (단일 세포유형)"
      - "Pacalin: 가법 합 잔차로 GI 분류 (훈련된 모델 아님, 교세포 전이 없음)"
    interpretation: "잔차 순위 전이는 가장 간단한 방법이나 실험적으로 최적(A7 rho=0.402 > A1 0.356). ICM 기반 전이는 무효 확인"
  integration_synergy:
    claim: "에피스태시스 보존→잔차 순위 전이→AL이 교세포 에피스태시스 탐지 효율 개선"
    novelty_level: "moderate"
    prior_art: []
    required_evidence_for_synergy:
      - "에피스태시스 교세포 보존 rho > 0.4 (run_11: 0.36-0.43, partial)"
      - "AL이 교세포 에피스태시스 탐지에서 2× 이상 개선 (run_11: 4-8× PASS)"
    interpretation: "ICM→에피스태시스→AL의 인과 경로는 기각. 보존→잔차 순위→AL로 경로 단순화. 비자명성이 약화"

contribution_decomposition:
  components:
    - component: "에피스태시스 교세포 보존 정량화"
      existing_prior_art: []
      independently_novel: true
      notes: "직접 경쟁자 0개. ICM과 무관한 생물학적 보존을 최초로 정량화 (rho=0.36-0.43, p<1e-26)"
    - component: "잔차→에피스태시스 분해 (합성 검증)"
      existing_prior_art:
        - "Tan 2018 (가법 근사 잔차=비가법 구조, 일반 이론)"
        - "Diamond 2024 (ML에서 feature interaction + FDR)"
        - "MoCHI 2024 (DMS 잔차에서 energetic coupling)"
      independently_novel: false
      notes: "아이디어 자체는 일반 원리. 적용 도메인(섭동 생물학)에서 0개. FCR 분해로 원천 식별은 차별화"
    - component: "MC Dropout UQ (유전자별·섭동별)"
      existing_prior_art:
        - "CIPHER (단일 신호원)"
      independently_novel: true
      notes: "MC Dropout이 대규모 perturb-seq에서 유효 (Replogle rho=0.660). ICM 위반 결합은 무효(weight=0.0)"
    - component: "잔차 순위 교세포 전이"
      existing_prior_art: []
      independently_novel: true
      notes: "가장 간단한 전이 방법이나 실험적으로 최적. ICM 전이보다 우수 (rho 0.402 vs 0.356)"
    - component: "교세포 에피스태시스 능동학습"
      existing_prior_art:
        - "NAIAD (적응적 임베딩 + AL, 단일 세포유형)"
      independently_novel: true
      notes: "교세포 에피스태시스 탐지 목적의 AL은 신규. 4-8× 개선, transfer overlap 0.80"
    - component: "3-공식 민감도 분석"
      existing_prior_art:
        - "Ajmal 2025 (5개 GI scoring 벤치마크)"
        - "Valenzuela 2025 (product neutrality)"
      independently_novel: false
      notes: "문헌에서 이미 입증. 잔차 분해에 적용은 신규이나 기여 약함"
    - component: "FCR z_x/z_t/z_tx 분해"
      existing_prior_art:
        - "FCR (arXiv:2410.22472)"
      independently_novel: false
      notes: "기존 방법 활용"
    - component: "ICM→에피스태시스 전이 개선"
      existing_prior_art: []
      independently_novel: false
      notes: "run_11에서 기각. ICM 개선율 0.966×. 부정적 결과로서 가치 — ICM이 일반 전이에 유효하나 에피스태시스 전이에 무효"

