  direct_competitor_count: 1
  density_decision: "low_competition"

trivial_baseline_bound:
  baseline_name: "가법 잔차 순위 전이 (K562 잔차 크기 순위 → RPE1 예측, A7)"
  expected_performance: "rho ≈ 0.40 (run_11 확인). ICM 전이보다 우수"
  target_delta_required: "rho > 0.4 (이미 A7에서 달성). 순환 위험 없음"
  rationale: "A7(잔차 순위)이 ICM 전이(A1)보다 우수하므로, 전이 방법의 novelty보다 '에피스태시스 교세포 보존 자체의 발견'이 핵심 기여"

