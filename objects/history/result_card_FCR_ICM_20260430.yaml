    - "Norman Precision이 trivial 대비 유의미 (2.4-3.0×)"
  weakens_claims:
    - "UQ Calibration: Coverage 0.293 — 90% CI가 신뢰할 수 없음"
    - "A7 잔차 순위 전이가 이전보다 약함 (0.326 vs run_11의 0.402)"
    - "CPA가 FCR보다 우수 — factorized 모델의 에피스태시스 전이 가치 의문"
  kills_claims:
    - "MC Dropout 90% CI가 well-calibrated이다 — 0.293으로 기각"
  new_questions:
    - "MC Dropout under-coverage의 원인? (dropout rate, conformal calibration 필요?)"
    - "CPA가 FCR보다 나은 것이 에피스태시스 보존의 단순성을 지지하는가?"
    - "Conformal prediction으로 coverage를 0.85-0.95로 교정 가능한가?"

