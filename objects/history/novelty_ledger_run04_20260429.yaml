  expected_performance: "rho > 0 (잔차가 세포유형 간 부분 상관), 단 ICM 없이는 음의 상관 가능 (run_07: -0.35)"
  target_delta_required: "ICM 전이 > 1.5× 비인과 전이. 순환 위험 없음"
  rationale: "비인과 baseline은 음의 상관이 가능하므로, ICM 정렬이 전이를 양의 상관으로 반전하는 것이 핵심 기여"

