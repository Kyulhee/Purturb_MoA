target_contribution: "FCR-ICM 기반 교세포 에피스태시스 전이 예측 + 불확실성 정량화 + 능동학습"

novelty_layers:
  abstract_principle:
    claim: "에피스태시스가 세포유형 간에 부분 보존되며, 한 세포유형의 에피스태시스 패턴으로 새 세포유형의 에피스태시스를 zero-shot 예측 가능"
    novelty_level: "strong"
    prior_art:
      - "C3TL: 교세포 일반 섭동 전이 (에피스태시스 특화 아님)"
      - "CFM-GP: 교세포 flow matching (에피스태시스 전이 없음)"
    interpretation: "에피스태시스의 교세포 보존을 예측에 활용하는 것은 새로운 원리. ICM 불변성 가정의 자연스러운 확장 (z_tx 불변 → 에피스태시스도 부분 불변)"
  domain_application:
    claim: "Perturb-seq 조합 섭동 잔차에서 교세포 에피스태시스 전이 예측"
    novelty_level: "strong"
    prior_art: []
    interpretation: "직접 경쟁자 0개 (PubMed 0건, arXiv 0건). 누구도 교세포 에피스태시스 전이를 시도하지 않음"
  method_specificity:
    claim: "ICM 정렬 z_tx 기반 에피스태시스 전이 + MC Dropout UQ + 교세포 AL"
    novelty_level: "strong"
    prior_art:
      - "CIPHER: 단일 신호원 불확실성 (교세포 전이 없음)"
    interpretation: "ICM 정규화→z_tx 정렬→에피스태시스 전이의 인과 경로가 구체적 기여"
  integration_synergy:
    claim: "불확실성 높은 곳 = 에피스태시스 가능성 높은 곳 = 교세포 전이 우선 순위"
    novelty_level: "strong"
    prior_art: []
    required_evidence_for_synergy:
      - "ICM 전이가 비인과 전이 대비 에피스태시스 예측을 개선 (run_10 예비: overlap 0.65)"
      - "UQ 기반 AL이 교세포 에피스태시스 탐지에서 5.0x 개선"
    interpretation: "UQ→에피스태시스→교세포 전이의 3단계 연결이 새로운 통합 기여"

