permissible_claim_strength:
  H1: "STRONG — Ranking reversal confirmed across all 3 datasets with simulated + real Ridge models. GEARS addition complicates picture: with only 4 models, K562/RPE1 show no reversal (tau=1.0). Norman remains most susceptible (tau=0.667). Qualify: 'reversal is model-diversity dependent; confirmed with Ridge-based evaluation and simulated models'"
  H2: "MODERATE — Domain-specific. Intra-domain (DEG↔f1, Mag↔f1): 100% pass. Cross-domain (Dir↔f1): 33.3%. MSE is domain-general; BioEval advantage is domain-specific interpretability."
  H3: "STRONG with qualification — Ridge (well-trained linear) > baselines across ALL 3 datasets. GEARS (DL) underperforms Ridge but beats naive baselines. Qualify: 'model quality, not complexity, determines BioEval performance. Well-trained models outperform baselines; DL training alone does not guarantee superiority. This finding itself validates BioEval's discriminative power.'"

publication_readiness:
  overall: "ready"
  H1_publishable: "yes — dual evidence (simulated + real models) across all 3 datasets. Note model-diversity dependency."
  H2_publishable: "yes — with domain-specific framing. Strong intra-domain evidence; cross-domain weakness is expected."
  H3_publishable: "yes — nuanced claim: well-trained > baseline confirmed; DL ≠ better is a finding. GEARS underperformance validates BioEval's discriminative power."
