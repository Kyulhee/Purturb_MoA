object_type: ValidationReadinessCard
status: active
last_updated: "2026-05-04"
linked_stage: analysis
linked_run: run_20

project: BioEval — Biologically-Grounded Evaluation for Perturbation Prediction

evidence_state:
  H1_metric_ranking_reversal:
    status: "STRONG EVIDENCE"
    strength: "high"
    datasets_tested: ["Replogle K562 (simulated + real Ridge + GEARS)", "Replogle RPE1 (simulated + real Ridge + GEARS)", "Norman 2019 (simulated + real Ridge + GEARS)"]
    key_findings:
      - "run_13 simulated: tau(MSE, Dir_deg) = 0.382 (K562), 0.600 (RPE1), -0.200 (Norman)"
      - "run_15-16 real Ridge: RPE1 REVERSAL (tau=0.333), K562 PARTIAL (tau=0.611), Norman PARTIAL (tau=0.500)"
      - "run_17 bootstrap CI: H1 independence confirmed"
      - "run_20 with GEARS: Norman tau(MSE,Dir_deg)=0.667 REVERSAL with 4 models; K562/RPE1 tau=1.0 (no reversal with 4 models)"
    gaps:
      - "With GEARS+Ridge+baselines (4 models), K562/RPE1 show tau=1.0 — reversal depends on model diversity"
      - "More diverse model set needed for robust H1 testing at per-dataset level"

  H2_metric_downstream_correlation:
    status: "MODERATE EVIDENCE — domain-specific"
    strength: "moderate"
    datasets_tested: ["Replogle K562 (real Ridge)", "Replogle RPE1 (real Ridge)", "Norman 2019 (real Ridge)"]
    key_findings:
      - "run_16 (aggregate): 15/15 pass per dataset"
      - "run_19 domain decomposition: intra-DEG 9/9 (100%), intra-magnitude 6/6 (100%), cross-domain 8/24 (33.3%)"
      - "MSE predicts dir_discovery at rho=0.88-0.96 — domain-general predictor"
      - "BioEval advantage is domain-specific interpretability, not cross-domain prediction"
    gaps:
      - "H2 must be claimed as domain-specific, not universal"

  H3_trained_vs_baseline:
    status: "STRONG EVIDENCE — with important qualification"
    strength: "high (for well-trained models); moderate (for DL models)"
    datasets_tested: ["Replogle K562 (Ridge + GEARS)", "Replogle RPE1 (Ridge + GEARS)", "Norman 2019 (Ridge + GEARS)"]
    key_findings:
      - "Ridge (linear trained) > baselines: ALL metrics across ALL 3 datasets (run_15-16)"
      - "GEARS (DL) vs Ridge: GEARS loses 0/12 key metrics (run_20)"
      - "GEARS (DL) vs mean_predictor: GEARS wins 11/12"
      - "GEARS (DL) vs mean_effect: GEARS wins 6/12 (mixed)"
      - "Norman GEARS catastrophically poor (R2=-0.699, only 128/283 valid predictions)"
    gaps:
      - "GEARS with only 5 epochs / minimal hyperparams — may not represent GEARS at full capacity"
      - "No CPA tested — single DL model is limited"
      - "Ridge LOO has information advantage (uses ground truth labels directly)"
    revised_claim: "Trained > baseline holds for well-trained models (Ridge). DL complexity alone does not guarantee superiority — a poorly-trained DL model can underperform even simple baselines. BioEval correctly identifies this quality gap."

