object_type: ResultCard
status: active
last_updated: "2026-05-01"
linked_stage: analysis
linked_run: run_19

project: BioEval — Biologically-Grounded Evaluation for Perturbation Prediction

hypothesis_results:
  - id: H1
    statement: "MSE/R2와 BioEval 방향 지표 간 모델 순위 불일치 존재 (tau < 0.7)"
    verdict: "SUPPORTED"
    evidence:
      - "run_13 (simulated): K562 tau=0.382, RPE1 tau=0.600, Norman tau=-0.200"
      - "run_15 (real Ridge, Norman): tau(MSE,Dir_deg)=0.500, tau(MSE,Dir_all)=0.500 — PARTIAL"
      - "run_15 (real Ridge, Norman): tau(Pearson,Dir_deg)=-0.167 — REVERSAL"
      - "run_16 (real Ridge, K562): tau(MSE,Dir_deg)=0.611 PARTIAL, tau(Pearson,Dir_deg)=0.056 REVERSAL"
      - "run_16 (real Ridge, RPE1): tau(MSE,Dir_all)=0.333 REVERSAL, tau(MSE,Dir_deg)=0.389 REVERSAL"
    strength: "strong — confirmed with real trained models across ALL 3 datasets"
    caveats:
      - "9 models — limited ranking resolution"
      - "Real Ridge reversal less extreme than simulated (Norman tau=0.5 vs -0.2)"
      - "No bootstrap CI yet — statistical robustness pending"

  - id: H2
    statement: "BioEval 지표가 MSE보다 downstream 생물학적 유용성을 더 잘 예측한다 (rho 차이 >= 0.1)"
    verdict: "SUPPORTED"
    evidence:
      - "run_14 (simulated): 80/90 pass (88.9%)"
      - "run_15 (real Ridge, Norman): 15/15 pass (100%)"
      - "run_16 (real Ridge, K562): 15/15 pass (100%), rho(MSE,f1@50)=0.487 vs rho(DEG_auprc,f1@50)=0.945 (diff=+0.458)"
      - "run_16 (real Ridge, RPE1): 15/15 pass (100%), rho(MSE,f1@50)=0.244 vs rho(DEG_auprc,f1@50)=0.945 (diff=+0.701)"
      - "run_16 (real Ridge, Norman): 15/15 pass (100%), rho(MSE,f1@50)=0.625 vs rho(DEG_auprc,f1@50)=0.992 (diff=+0.367)"
    strength: "moderate — domain-specific; strong for intra-domain pairs, weak for cross-domain"
    caveats:
      - "N=9 models — Spearman rho limited statistical resolution"
      - "run_19 domain decomposition: H2 100% pass rate driven by intra-domain pairs (DEG↔DEG, Mag↔Mag)"
      - "Cross-domain H2 only 33.3% (8/24) — Dir metrics do NOT predict gene-set tasks better than MSE"
      - "DEG_auprc vs f1@50 (intra-DEG): 100% pass — not circular, confirms BioEval captures meaningful signal"
      - "Revised H2 claim: BioEval metrics provide DOMAIN-SPECIFIC predictive advantage over MSE"

  - id: H3
    statement: "BioEval 하에서 trained > baseline인 섭동 체계 존재"
    verdict: "SUPPORTED (3 datasets, corrected)"
    evidence:
      - "K562: Dir_deg 0.985 vs 0.606, R2 0.523 vs -0.013, ALL 6 metrics trained wins"
      - "RPE1: Dir_deg 0.989 vs 0.666, R2 0.652 vs -0.013, ALL 6 metrics trained wins"
      - "Norman: Dir_deg 0.986 vs 0.571, R2 0.643 vs -0.002, ALL 6 metrics trained wins"
    note: "Oracle baselines (constant_shrink, half_signal) excluded from H3."
    strength: "strong — confirmed with real trained models across ALL 3 datasets"
    caveats:
      - "Ridge is linear, not DL — H3 claim about 'DL > baseline' requires DL model testing"
      - "Oracle baselines (constant_shrink, half_signal) must be excluded from H3"

key_metrics_H1_run16:
  - dataset: "Replogle K562 (real Ridge, gene PCA features)"
    key_tau: {MSE_vs_Dir_all: 0.500, MSE_vs_Dir_deg: 0.611, Pearson_vs_Dir_deg: 0.056}
    verdict: "PARTIAL/REVERSAL"
  - dataset: "Replogle RPE1 (real Ridge, gene PCA features)"
    key_tau: {MSE_vs_Dir_all: 0.333, MSE_vs_Dir_deg: 0.389, Pearson_vs_Dir_deg: 0.111}
    verdict: "REVERSAL (strongest real-model evidence)"
  - dataset: "Norman 2019 (real Ridge, additive features)"
    key_tau: {MSE_vs_Dir_all: 0.500, MSE_vs_Dir_deg: 0.500, Pearson_vs_Dir_deg: -0.167}
    verdict: "PARTIAL/REVERSAL"

key_metrics_H2_run19_domain_decomposition:
  - domain: "cross-domain"
    h2_pass_rate: "8/24 (33.3%)"
    mean_gap: -0.086
    interpretation: "Dir metrics do NOT predict gene-set tasks better than MSE. This is expected — direction information should not predict gene-set recovery."
  - domain: "intra-DEG"
    h2_pass_rate: "9/9 (100%)"
    mean_gap: +0.319
    interpretation: "DEG_auprc predicts f1@50 well — both measure DEG quality. Not circular; confirms meaningful signal."
  - domain: "intra-magnitude"
    h2_pass_rate: "6/6 (100%)"
    mean_gap: +0.303
    interpretation: "mag_rank predicts gene-set tasks well — shared magnitude information."
  - domain: "intra-direction"
    h2_pass_rate: "3/6 (50%)"
    mean_gap: -0.013
    interpretation: "Dir vs dir_discovery: partially circular, weak advantage."

key_metrics_H2_cross_domain_detail:
  - dataset: "K562"
    pairs: "6 PASS / 8 total, best: Dir_deg vs f1@50 gap=+0.036, worst: DEG_auprc vs dir_discovery gap=-0.244"
  - dataset: "RPE1"
    pairs: "6 PASS / 8 total, best: Dir_all vs f1@50 gap=+0.162, worst: DEG_auprc vs dir_discovery gap=-0.406"
  - dataset: "Norman"
    pairs: "0 PASS / 8 total, all gaps negative (-0.111 to -0.237)"

key_insight_MSE_direction:
  finding: "MSE predicts direction tasks (dir_discovery) with rho=0.883-0.964, BETTER than Dir predicts gene-set tasks (rho=0.559-0.721)"
  implication: "MSE is a domain-general predictor that captures both magnitude and direction signal. BioEval's advantage is domain-specific interpretability, not cross-domain prediction."

direction_independent_tasks:
  - task: "mag_rank"
    definition: "Spearman(|pred|, |true|) among DEGs"
    uses_direction: false
    h2_pass_rate: "intra-magnitude 6/6 (100%)"
  - task: "top100_overlap"
    definition: "Jaccard(top-100 |pred|, top-100 |true|)"
    uses_direction: false
    h2_pass_rate: "varies by domain pair"
  overall_direction_independent: "23/33 (69.7%) pass"

