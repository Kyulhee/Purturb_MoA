    GEARS: {R2: 0.085, Pearson: 0.513, Dir_deg: 0.888, DEG_auprc: 0.345, f1_at_50: 0.241, MSE: 0.0057}
    Ridge: {R2: 0.610, Pearson: 0.771, Dir_deg: 0.988, DEG_auprc: 0.633, f1_at_50: 0.380, MSE: 0.0022}
    verdict: "Ridge wins 4/4 key metrics"
  - dataset: "Replogle RPE1 (GEARS vs Ridge)"
    GEARS: {R2: 0.147, Pearson: 0.613, Dir_deg: 0.890, DEG_auprc: 0.481, f1_at_50: 0.193, MSE: 0.0100}
    Ridge: {R2: 0.696, Pearson: 0.824, Dir_deg: 0.983, DEG_auprc: 0.724, f1_at_50: 0.281, MSE: 0.0036}
    verdict: "Ridge wins 4/4 key metrics"
  - dataset: "Norman 2019 (GEARS vs Ridge)"
    GEARS: {R2: -0.699, Pearson: 0.256, Dir_deg: 0.422, DEG_auprc: 0.182, f1_at_50: 0.154, MSE: 0.0074}
    Ridge: {R2: 0.896, Pearson: 0.962, Dir_deg: 1.000, DEG_auprc: 0.925, f1_at_50: 0.551, MSE: 0.0004}
    verdict: "Ridge wins 4/4 key metrics"
    note: "GEARS only 128/283 valid predictions — 'ctrl+gene' format incompatible with GEARS predict()"

structural_issues:
  gears_prediction_gap:
    status: "IDENTIFIED (run_20)"
    affected_datasets: ["Norman (severe)", "K562", "RPE1"]
    cause: "GEARS predict() requires genes in perturbation graph; 'ctrl' is not a perturbable gene. Norman single-KOs use 'ctrl+gene' format → 155/283 predictions fail."
    resolution: "Accepted as limitation. GEARS predictions for valid perturbations are still poor (Norman R2=-0.699 for 128 valid). K562/RPE1 have 99.5% valid predictions but still underperform Ridge."
    implication: "GEARS API limitation is NOT the primary cause of poor performance — even valid predictions underperform Ridge"

  gears_vs_ridge_gap:
    status: "KEY FINDING (run_20)"
    finding: "GEARS (DL, GNN+attention) consistently underperforms Ridge (linear, LOO-corrected) on ALL BioEval metrics across ALL 3 datasets"
    possible_causes:
      - "5 epochs may be insufficient for GEARS convergence — but val MSE plateaued"
      - "GEARS hidden_size=64 may be too small — but original paper uses similar settings"
      - "GEARS trained on simulation split (unseen_single test) — may not align with our evaluation set"
      - "Ridge LOO uses ground truth labels directly — information advantage"
      - "GEARS GNN may not effectively propagate signal for perturbation prediction"
    implication: "DL complexity does not guarantee better perturbation prediction. This supports BioEval's value proposition: BioEval metrics correctly identify that Ridge's predictions are biologically more faithful than GEARS's."

limitations:
  - "GEARS training with 5 epochs only — may not represent GEARS at full capacity"
  - "GEARS hyperparameters (hidden_size=64, num_layers=2) are minimal — original paper may use different settings"
  - "GEARS simulation split may not align with our evaluation perturbation set"
  - "4 models only (GEARS, Ridge, mean_predictor, mean_effect) — limited ranking resolution for H1"
  - "No CPA model tested — only one DL model (GEARS)"
  - "Ridge LOO has information advantage (uses ground truth labels)"

next_steps:
