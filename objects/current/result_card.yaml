structural_issues:
  one_hot_loo_degeneracy:
    status: "RESOLVED (run_16)"
    affected_datasets: ["K562", "RPE1"]
    cause: "Single-KO datasets use identity feature matrix; LOO removes only distinguishing feature"
    resolution: "Gene PCA features: [pca_mean(30) | pca_var(30) | log_cell_count(1)] = 61 dims. K562 R2 -0.027→0.523, RPE1 -0.027→0.652"
  oracle_baselines:
    affected_models: ["constant_shrink", "half_signal"]
    cause: "Use ground truth signal directly (0.15×true, 0.5×true)"
    evidence: "constant_shrink Dir_deg=1.0, DEG_auprc=1.0 — perfect via oracle access"
    resolution: "Exclude from H3 comparison; classify as oracle upper bounds"

limitations:
  - "Ridge is linear model — H3 'DL > baseline' requires DL model testing"
  - "9 models (3 Ridge alphas + 2 degraded + 2 baselines + 2 oracle) — limited model diversity"
  - "No bootstrap CI for tau/rho — statistical robustness pending"
  - "Norman logFC scale mismatch — downstream task discrimination limited"
  - "Downstream task circularity: RESOLVED (run_19). H2 is domain-specific. Cross-domain H2 weak but expected; intra-domain H2 strong and not circular."
  - "Gene PCA features have low cumulative variance (9-14% for 30 PCs)"

next_steps:
  - "Bootstrap confidence intervals for all rho and tau estimates (A2) — DONE run_17"
  - "Norman logFC scale normalization (A3) — DONE run_18"
  - "Downstream task independence justification — address circularity (A4) — DONE run_19"
  - "Pursue GEARS/CPA for real DL model predictions — H3 'DL > baseline' definitive test"
  - "Refine H2 claim to domain-specific framing based on run_19 findings"
  - "Proceed to Stage 05 (Interpretation) for paper draft"
