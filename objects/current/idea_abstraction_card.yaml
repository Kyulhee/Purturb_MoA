domain_specific_idea: "Perturb-seq 섭동 예측의 평가 지표가 생물학적 충실도를 측정하지 못한다. MSE/R²는 재구성 정확도만 측정하며, 생물학적으로 올바른 예측과 단순 평균 예측을 구분하지 못한다. 이것이 Ahlmann-Eltze(2025)의 'DL ≤ baseline' 위기의 근본 원인일 가능성이 높다."

abstract_principle:
  statement: "최적화 목표(평가 지표)가 모델 행동을 결정한다. 잘못된 지표는 잘못된 최적화 목표를 만들고, 이는 잘못된 모델 행동과 잘못된 결론으로 이어진다. 생물학적 충실도를 측정하는 지표가 없으면, 모델 비교가 무의미하다"
  confidence: "very_high"
  rationale: "3개 독립 그룹의 수렴 증거: Ahlmann-Eltze(DL≤baseline), SCALE(mean-effect trap), Shesha(magnitude≠stability). 우리 자신의 CPA>FCR 결과도 같은 방향. 이것은 가설이 아닌 관찰된 사실"

